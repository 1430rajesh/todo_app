<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Productivity Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                <div class="brand-icon">✓</div>

                <div>
                    <h1>TaskFlow</h1>
                    <p>Organize your work. Get things done.</p>
                </div>
            </div>

            <button id="themeBtn" class="theme-btn" title="Toggle theme">
                🌙
            </button>

        </header>


        <!-- ================= STATS ================= -->

        <section class="stats-grid">

            <div class="stat-card">
                <div class="stat-icon blue">📋</div>

                <div>
                    <span>Total Tasks</span>
                    <strong id="totalTasks">0</strong>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">✓</div>

                <div>
                    <span>Completed</span>
                    <strong id="completedTasks">0</strong>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon orange">⏳</div>

                <div>
                    <span>Pending</span>
                    <strong id="pendingTasks">0</strong>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon red">!</div>

                <div>
                    <span>Overdue</span>
                    <strong id="overdueTasks">0</strong>
                </div>
            </div>

        </section>


        <!-- ================= PROGRESS ================= -->

        <section class="progress-card">

            <div class="progress-header">
                <div>
                    <h3>Today's Progress</h3>
                    <p>Keep moving forward 🚀</p>
                </div>

                <strong id="progressPercent">0%</strong>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </section>


        <!-- ================= ADD TASK ================= -->

        <section class="task-form">

            <div class="form-header">
                <h2 id="formTitle">Add New Task</h2>

                <button id="cancelEdit" class="cancel-btn hidden">
                    Cancel Edit
                </button>
            </div>

            <div class="form-grid">

                <div class="input-group full">
                    <label>Task</label>

                    <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="150">
                </div>


                <div class="input-group">

                    <label>Category</label>

                    <select id="categoryInput">

                        <option value="work">
                            💼 Work
                        </option>

                        <option value="personal">
                            🏠 Personal
                        </option>

                        <option value="study">
                            📚 Study
                        </option>

                        <option value="shopping">
                            🛒 Shopping
                        </option>

                        <option value="other">
                            📌 Other
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>Priority</label>

                    <select id="priorityInput">

                        <option value="low">
                            🟢 Low
                        </option>

                        <option value="medium" selected>
                            🟡 Medium
                        </option>

                        <option value="high">
                            🔴 High
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>Due Date</label>

                    <input type="date" id="dateInput">

                </div>


                <div class="input-group button-group">

                    <button id="saveTaskBtn" class="primary-btn">
                        + Add Task
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= TOOLBAR ================= -->

        <section class="toolbar">

            <div class="search">

                <span>🔍</span>

                <input type="text" id="searchInput" placeholder="Search tasks...">

            </div>


            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

                <button class="filter" data-filter="overdue">
                    Overdue
                </button>

            </div>


            <div class="sort">

                <label>Sort:</label>

                <select id="sortSelect">

                    <option value="newest">
                        Newest
                    </option>

                    <option value="oldest">
                        Oldest
                    </option>

                    <option value="priority">
                        Priority
                    </option>

                    <option value="dueDate">
                        Due Date
                    </option>

                    <option value="alphabetical">
                        A-Z
                    </option>

                </select>

            </div>

        </section>


        <!-- ================= TASK LIST ================= -->

        <main>

            <div class="list-header">

                <h2>Your Tasks</h2>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>


            <div id="taskList"></div>


            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>

                <h2>No tasks found</h2>

                <p>
                    Add your first task and start being productive.
                </p>
            </div>

        </main>


        <!-- ================= FOOTER ================= -->

        <footer>

            <span id="taskSummary">
                0 tasks
            </span>

            <button id="clearAll">
                Clear All
            </button>

        </footer>


        <!-- ================= TOAST ================= -->

        <div id="toast" class="toast"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
